appId: com.louismollick.likedmusicsyncer
productName: Liked Music
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/.vscode/*'
  - '!src/*'
  - '!test/*'
  - '!docs/*'
  - '!scripts/*'
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/better-sqlite3/**
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
      - '!README.txt'
mac:
  category: public.app-category.music
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  entitlements: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: Liked Music saves your songs to the folder you choose.
    NSDownloadsFolderUsageDescription: Liked Music saves your songs to the folder you choose.
    NSMusicFolderUsageDescription: Liked Music saves your songs to the folder you choose.
dmg:
  artifactName: liked-music-${version}-${arch}.${ext}
npmRebuild: false
