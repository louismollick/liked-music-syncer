appId: com.electron.app
productName: liked-music-syncer
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,biome.json,drizzle.config.ts}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**
extraResources:
  - from: resources/bin
    to: bin
win:
  executableName: liked-music-syncer
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: liked-music-syncer needs access to write audio files to your selected library.
    - NSDownloadsFolderUsageDescription: liked-music-syncer may access downloaded tooling and exported media.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: mollicl
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
