name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install rclone
        run: |
          curl -sSLo /tmp/rclone.zip https://downloads.rclone.org/v1.75.0/rclone-v1.75.0-linux-amd64.zip
          echo "aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa  /tmp/rclone.zip" | sha256sum -c -
          unzip -q /tmp/rclone.zip -d /tmp
          sudo install /tmp/rclone-v1.75.0-linux-amd64/rclone /usr/local/bin/rclone
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  smoke:
    name: macOS package smoke test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tools:fetch
      - name: Build unpacked app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm build:unpack
      - name: Run smoke test
        run: '"release/mac-arm64/Liked Music.app/Contents/MacOS/Liked Music" --smoke-test'
