[project]
name = "liked-music-syncer-worker"
version = "0.1.0"
description = "YT Music worker for liked-music-syncer"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "lingua-language-detector>=2.2.0",
  "mediafile>=0.13.0",
  "mypy>=1.18.2",
  "pillow>=11.2.1",
  "pytest>=8.4.2",
  "yt-dlp>=2025.11.12",
  "ytmusicapi>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liked_music_syncer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
